# Dart analyzer settings from the Flutter stack kit.
# Copy to the repository root (merge with an existing file). Run: flutter analyze
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    use_build_context_synchronously: error
    unawaited_futures: error
    cancel_subscriptions: error

linter:
  rules:
    - use_build_context_synchronously
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - avoid_print
