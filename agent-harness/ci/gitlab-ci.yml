# Agent harness checks for GitLab CI.
# Include it from your .gitlab-ci.yml:
#
#   include:
#     - local: '.harness/ci/gitlab-ci.yml'
#
# The job uses the "test" stage; if your pipeline defines its own stages, add
# "test" to them or change the stage below. It runs in merge request pipelines.
#
# Approving an intended test change: add the label "test-change-approved" to the
# merge request, then select "Run pipeline" on the merge request.
agent-harness:
  stage: test
  image: alpine:3.20
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache bash git grep sed diffutils
  script:
    - bash .harness/build-agents-md.sh --check
    - bash .harness/checks/protected-tests.sh
